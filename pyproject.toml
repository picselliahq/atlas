[project]
name = "atlas-vision"                       # ← stays dashed (PyPI / pip install)
version = "0.1.0"
description = "A powerful dataset analysis and management tool for computer vision"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Picsellia", email = "contact@picsellia.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "uvicorn[standard]>=0.34.0,<1",
    "fastapi>=0.115.12,<1",
    "celery>=5.5.0,<6",
    "redis>=5.2.1,<6",
    "picsellia>=6.21.5,<7",
    "pydantic-settings>=2.8.1,<3",
    "pydantic-ai>=0.0.55,<0.1",
    "smolagents>=1.13.0,<2",
    "litellm>=1.65.5,<2",
    "transformers>=4.51.1,<5",
    "torch>=2.6.0,<3",
    "ultralytics>=8.3.106,<9",
    "opencv-python>=4.11.0.86,<5",
    "pandas>=2.2.3,<3",
    "scikit-learn>=1.6.1,<2",
    "umap-learn>=0.5.7,<1",
    "shapely>=2.1.0,<3",
    "matplotlib>=3.10.1,<4",
    "seaborn>=0.13.2,<1",
    "sentry-sdk>=2.26.1",
    "click>=8.1.7,<9",
]

# ──────────────────────────
# CLI entry-point ⤵
# users type  `atlas-vision …`  →  python calls  atlas_vision.cli:main()
# ──────────────────────────
[project.scripts]
atlas-vision = "atlas_vision.cli:atlas"

# ──────────────────────────
# Build system (Hatchling)
# ──────────────────────────
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# Tell Hatchling where the real package lives (src layout)
[tool.hatch.build.targets.wheel]
packages = ["src/atlas_vision"]
include = [
    "src/atlas_vision/**/*.py",
    "src/atlas_vision/**/*.json",
    "src/atlas_vision/**/*.yaml",
    "src/atlas_vision/**/*.yml",
]

# Ruff still needs to know the source root inside src/
[tool.ruff]
src = ["src/atlas_vision"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*BeartypeCallHintPepParamException.*:DeprecationWarning",
    "ignore:.*Support for class-based `config` is deprecated.*:DeprecationWarning",
    "ignore:.*open_text is deprecated.*:DeprecationWarning",
    "ignore:.*There is no current event loop.*:DeprecationWarning",
]

[tool.coverage.report]
include = ["src/*", "tests/*"]
omit = []
